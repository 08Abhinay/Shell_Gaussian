[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "footshellgaussian-foot-prior"
version = "0.1.0"
description = "Deterministic neutral SUPR-to-shoe alignment"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23",
    "trimesh>=4.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["foot_prior*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
